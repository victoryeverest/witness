[project]
name = "witness-backend"
version = "1.0.0"
description = "WITNESS — Evidence-Driven Autonomous Cyber Defense & Investigation Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "yara-python>=4.5",
    "pysigma>=1.0",
    "dpkt>=1.9",
    "scapy>=2.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: end-to-end runs of the full investigation loop",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["witness"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables) + a few bug-prone
# patterns. Style rules are intentionally not enforced.
select = ["F", "B006", "E721", "E9"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
